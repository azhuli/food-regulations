<style>
:root{--ink:#FFFDF8;--mut:#CFD8CF;--gold:#E3A21A;--line:#3B5A44;--ok:#2D7A3A;--okl:#7FBF8B;--bad:#FF8A75;--panel:rgba(10,20,14,.82);--dlg:rgba(10,20,14,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0F1F16;color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:20px;line-height:1.5;min-height:100vh;min-height:100dvh}
.serif{font-family:inherit}
html:lang(vi) body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','PingFang TC','Microsoft JhengHei',sans-serif}
.lang button{white-space:nowrap}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.55;cursor:default}
#bgA,#bgB{position:fixed;inset:0;z-index:0}
#bgA{background:linear-gradient(180deg,#24402D 0%,#17301F 55%,#0F1F16 100%)}
#bgB{inset:-10px;background-size:cover;background-position:center top;filter:blur(4px);display:none}
#bgC{position:fixed;inset:0;z-index:0;background:rgba(10,20,14,.66);display:none}
body.scene #bgB,body.scene #bgC{display:block}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hdr{min-height:64px;flex-shrink:0;background:rgba(10,20,14,.97);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 16px;position:sticky;top:0;z-index:5}
.hdr .hbr{flex:0 0 100%;height:0}
.hdr .tm{flex:1 0 100%;display:flex;align-items:center;gap:12px;padding:4px 0 2px}
.hdr .tm .bar{height:12px}
.hdr .tm #ttxt{font-weight:700;min-width:52px;text-align:right;font-size:22px;line-height:1}
.hdr .l{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 0}
.hdr .r{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{width:40px;height:40px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo img{width:32px;height:32px;object-fit:contain}
.brand{font-weight:900;font-size:22px;line-height:1.1}
.h-t{font-weight:900;font-size:22px;line-height:1.15;color:var(--gold)}
.h-s{font-size:18px;color:var(--mut);line-height:1.2}
.lang{display:flex;border:2px solid rgba(255,255,255,.55);border-radius:22px;overflow:hidden}
.lang button{border:0;padding:6px 14px;background:transparent;color:#fff;font-weight:700;font-size:18px}
.lang button.on{background:#fff;color:#1B4D26}
@media (max-width:480px){.lang button{padding:5px 10px;font-size:16px}.hdr .r{gap:8px}.hdr .h-t{white-space:nowrap}.hdr .h-s{font-size:16px}.hdr .r > div svg{width:22px;height:22px}}
.wrap{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding-bottom:20px}
.body{display:flex;flex-direction:column}
.npcCol{padding:14px 16px 0;display:flex;align-items:flex-end;gap:12px}
.npc{width:120px;height:150px;flex-shrink:0;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 3px #FFFDF8) drop-shadow(0 0 8px rgba(255,253,248,.6))}
.npc.sm{width:100px;height:124px}.npc.lg{width:240px;height:330px}
.beside{padding-bottom:6px;min-width:0}
.dlg{margin:10px 16px 0;background:var(--dlg);border:2px solid var(--gold);border-radius:16px;padding:14px 18px;position:relative}
.dlg .nm{font-weight:900;font-size:24px;color:var(--gold);line-height:1.3}

.btns{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}

.tag{display:inline-block;background:#FBF0D2;color:#1E2B22;border:2px solid var(--gold);border-radius:20px;padding:2px 12px;font-size:18px;font-weight:700}
.eyebrow{font-size:18px;font-weight:700;letter-spacing:.12em;color:var(--okl)}

.card.lock .yr{color:#9FB2A4}
.card .nm2{font-weight:900;font-size:24px;margin-top:4px;line-height:1.25}
.chip{display:flex;align-items:center;gap:6px;border-radius:20px;padding:4px 12px;font-size:18px;font-weight:700;flex-shrink:0;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(227,162,26,.18);border:2px solid var(--gold);border-radius:10px;padding:6px 12px;font-weight:700;font-size:18px;color:#F7D58A}
.cards{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.q-top{padding:12px 16px 0;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--okl);border-radius:7px;transition:width .4s linear,background .3s}
.opts{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:64px;padding:10px 14px;border:2px solid #CFD8CF;border-radius:12px;background:rgba(255,253,248,.96);color:#1E2B22;font-size:20px;line-height:1.5}
.opt .k{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:2px solid #7C8C80;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.opt.sel{border:3px solid var(--ok);background:#E6F2E8;font-weight:700}
.opt.sel .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.clues{margin:12px 16px 0;background:var(--panel);border:2px solid var(--okl);border-radius:14px;padding:12px 14px}
.clues .ch{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--gold)}
.clues .hint{margin-top:2px;font-size:16px;color:var(--mut);line-height:1.4}
.clues ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.clues li{display:flex;gap:10px;align-items:flex-start;font-size:20px;line-height:1.5}
.clues li b{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1E2B22;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:1px}
.clues li.new{animation:rise .38s ease-out both}
.clues .more{margin-top:12px;width:100%;min-height:52px;border:2px dashed var(--gold);border-radius:12px;background:transparent;color:#F7D58A;font-weight:700;font-size:18px}
.opts.scene{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.card2{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;min-height:0}
.opt.card2 img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:#EFE9D8}
.opt.card2 .cl{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;font-size:17px;line-height:1.4}
.opt.card2 .k{width:28px;height:28px;font-size:16px}
.fo{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:12px;line-height:1.5}
.fo .k{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.fo small{display:block;font-size:18px;font-weight:700;margin-top:2px}
.fo.bad{border:3px solid var(--bad);background:rgba(179,50,31,.28)}.fo.bad .k{background:var(--bad);color:#1E2B22}.fo.bad small{color:#FFB3A3}
.fo.good{border:3px solid var(--okl);background:rgba(45,122,58,.35)}.fo.good .k{background:var(--okl);color:#0F1F16}.fo.good small{color:#BFE0C4}
.banner{margin:14px 16px 0;display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 14px}
.banner.bad{background:rgba(179,50,31,.9);border:2px solid var(--bad)}
.banner.good{background:rgba(45,122,58,.92);border:2px solid var(--okl)}
.banner .b1{font-weight:900;font-size:24px;line-height:1.2}.banner .b2{font-size:18px}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-weight:900;font-size:32px;color:var(--gold);line-height:1.1}.stat .c{font-size:18px;color:var(--mut)}
.remember{margin:14px 16px 0;background:rgba(251,240,210,.96);color:#1E2B22;border:2px solid var(--gold);border-radius:16px;padding:14px 16px}
.remember b{font-size:20px}.remember div{font-weight:900;font-size:24px;line-height:1.5;margin-top:4px}
.dots{display:flex;justify-content:center;padding-top:10px;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--gold)}
.spacer{flex:1}
.foot{padding:12px 16px;text-align:center;font-size:18px;color:var(--mut)}
#busy{position:fixed;inset:0;z-index:50;background:rgba(10,20,14,.55);display:none;align-items:center;justify-content:center}
#busy i{width:48px;height:48px;border:5px solid rgba(255,255,255,.3);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:16px;right:16px;bottom:20px;z-index:60;max-width:520px;margin:0 auto;background:rgba(179,50,31,.96);border:2px solid var(--bad);border-radius:12px;padding:12px 16px;font-weight:700;display:none}
.lb{display:flex;flex-direction:column;gap:12px}
.lbr .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.lbr .row2{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:18px;color:var(--mut)}
.lbr .bg{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.lbr .bg i{display:block;height:100%;background:var(--okl)}
.lbr.me .row1{color:var(--gold)}
.rk{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1E2B22;align-items:center;justify-content:center;font-weight:900;margin-right:8px;font-size:18px}
.take{display:flex;gap:10px;align-items:flex-start;margin-top:10px;line-height:1.5}
.take b{color:var(--gold);flex-shrink:0;min-width:52px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bgi{border:2px solid var(--gold);background:rgba(227,162,26,.18);border-radius:12px;padding:8px 10px;font-weight:700;text-align:center;line-height:1.3}
.bgi small{display:block;font-size:18px;color:#F7D58A}
.bgi.no{border:2px dashed #4A6552;background:transparent;color:#9FB2A4}.bgi.no small{color:#9FB2A4}

/* ===== motion ===== */
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.015)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-34px) scale(1.04,.97)}50%{transform:translateY(0) scale(1.05,.95)}70%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@keyframes sway{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.88)}60%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}35%{transform:translateX(8px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(127,191,139,0)}50%{box-shadow:0 0 22px 4px rgba(127,191,139,.65)}}
@keyframes brk{0%{transform:scale(2) rotate(-14deg);filter:drop-shadow(0 0 8px #FF8A75)}35%{transform:scale(1.25) rotate(12deg)}60%{transform:scale(.8) rotate(-8deg)}100%{transform:none;filter:none}}
@keyframes lowpulse{0%,100%{transform:scale(1);color:#fff}50%{transform:scale(1.25);color:#FF8A75}}
@keyframes selpop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes shine{0%,60%{background-position:-160% 0}100%{background-position:260% 0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.npc{animation:float 3.2s ease-in-out infinite;transform-origin:50% 100%}
.npc.jump{animation:jump .9s ease-out 1,float 3.2s ease-in-out .9s infinite}
.npc.sway{animation:sway .9s ease-in-out 1,float 3.2s ease-in-out .9s infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
#egg{position:fixed;inset:0;z-index:60;background:rgba(5,12,8,.8);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s ease-out both}
#egg .eggc{max-width:440px;width:100%;max-height:100%;overflow:auto;background:var(--dlg);border:2px solid var(--gold);border-radius:18px;padding:18px 20px;text-align:center}

#egg li{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:900;line-height:1.3}
#egg li svg{flex-shrink:0}
#egg .kn{font-size:20px;line-height:1.65;text-align:left;margin:12px 0 0}
.knchip{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;padding:7px 14px 7px 10px;border-radius:999px;border:2px solid #F7D58A;background:rgba(247,213,138,.14);color:#FFE9A8;font:inherit;font-size:18px;font-weight:900;cursor:pointer;animation:knp 2.2s ease-in-out infinite}
.knchip svg{width:22px;height:22px}
.knchip small{font-size:15px;font-weight:400;color:#D9C48A}
.fullc .beside{text-align:center}
@media (max-width:899px){.npcCol.fullc{flex-direction:column;align-items:center;gap:4px}.fullc .npc{width:250px;height:212px}}
.trophy{vertical-align:-6px;filter:drop-shadow(0 0 6px rgba(247,213,138,.7))}
.knchip:active{transform:scale(.97)}
@keyframes knp{0%,100%{box-shadow:0 0 0 0 rgba(247,213,138,.0)}50%{box-shadow:0 0 0 6px rgba(247,213,138,.22)}}
.wrap{animation:fade .4s ease-out both}
.dlg{animation:pop .42s cubic-bezier(.2,1.2,.4,1) both}
.cards>div{animation:rise .45s ease-out both}
.cards>div:nth-child(2){animation-delay:.08s}.cards>div:nth-child(3){animation-delay:.16s}.cards>div:nth-child(4){animation-delay:.24s}
.opts .opt{animation:rise .38s ease-out both}
.opts .opt:nth-child(2){animation-delay:.06s}.opts .opt:nth-child(3){animation-delay:.12s}.opts .opt:nth-child(4){animation-delay:.18s}
.opt{transition:transform .12s,background .15s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt.sel{animation:selpop .25s ease-out}
.btn{transition:transform .12s,filter .15s}
.btn:not(:disabled):active{transform:scale(.97)}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.12);transform:translateY(-1px)}.opt:hover{border-color:var(--ok)}}
.banner.good{animation:pop .45s cubic-bezier(.2,1.2,.4,1) both,glow 1.4s ease-in-out .3s 2}
.banner.bad{animation:shake .5s ease-in-out both}
.hdr svg.brk{animation:brk .9s ease-out both}

.fo{animation:rise .35s ease-out both}

.dlg svg[style*="absolute"]{animation:blink 1.1s ease-in-out infinite}
body.scene #bgB{animation:kb 22s ease-in-out infinite alternate}
.cfx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cfx i{position:absolute;left:50%;top:34%;width:10px;height:14px;border-radius:2px;animation:cf var(--t) cubic-bezier(.25,.5,.45,1) forwards}
.na *{animation:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@keyframes starpop{0%{opacity:0;transform:scale(0) rotate(-120deg)}70%{transform:scale(1.35) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes litpop{0%{transform:scale(0) rotate(-40deg);filter:drop-shadow(0 0 0 #E3A21A)}60%{transform:scale(1.35) rotate(8deg);filter:drop-shadow(0 0 14px #FFE9A8)}100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 6px rgba(227,162,26,.6))}}
@keyframes beat{0%{opacity:0}18%{opacity:1}55%{opacity:.15}100%{opacity:0}}

.stars{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}

var LEVELS=[{"level": 1, "year": "2011", "bg": "bg-2011.jpg", "title": ["塑化劑事件", "Sự kiện chất hóa dẻo"], "theme": ["供應商與原料管理", "Quản lý nhà cung cấp và nguyên liệu"], "badge": ["供應商鑑定師", "Thẩm định viên nhà cung cấp"], "remember": ["每一環都以為自己不是最後一關，結果沒人把關。", "Mỗi khâu đều nghĩ mình không phải khâu cuối cùng, kết quả là không ai kiểm soát."], "story": [["歡迎來到 2011 年 4 月。一款益生菌產品被驗出含有塑化劑 DEHP。", "Tháng 4/2011, một sản phẩm men vi sinh bị phát hiện chứa chất hóa dẻo DEHP."], ["衛生署一路追查，最後追到一家只有四名員工的小公司，昱伸。", "Cơ quan y tế Đài Loan truy ngược theo chuỗi cung ứng và cuối cùng tìm đến một công ty nhỏ chỉ có bốn nhân viên là Dục Thân (昱伸)."], ["業者用廉價塑化劑取代食用原料做成起雲劑，再被用在飲料、果醬、錠劑和粉狀食品中。", "Nhà sản xuất này dùng chất hóa dẻo công nghiệp giá rẻ thay cho nguyên liệu dùng được trong thực phẩm để làm chất tạo đục, sau đó chất này được dùng trong đồ uống, mứt, viên nén và thực phẩm dạng bột."], ["到 5 月 28 日，受污染的產品已有 489 項，涉及 155 家業者。一家上游，牽連一大群下游。", "Đến ngày 28/5, đã có 489 sản phẩm bị nhiễm, liên quan đến 155 doanh nghiệp."]]}, {"level": 2, "year": "2008", "bg": "bg-2008.jpg", "title": ["三聚氰胺事件", "Sự kiện melamine"], "theme": ["食品欺詐與檢驗盲點", "Gian lận thực phẩm và điểm mù trong kiểm nghiệm"], "badge": ["數據偵探", "Thám tử dữ liệu"], "remember": ["報告好看不代表沒問題，要問這個方法看到什麼、沒看到什麼。", "Báo cáo đẹp không có nghĩa là không có vấn đề. Phải hỏi phương pháp này nhìn thấy gì và không nhìn thấy gì."], "story": [["時間回到 2008 年。三鹿奶粉被查出摻入三聚氰胺，影響 30 多萬名嬰幼兒，共有 6 人死亡。", "Năm 2008, sữa bột Tam Lộc (三鹿, Sanlu) bị phát hiện bị trộn melamine, ảnh hưởng hơn 300.000 trẻ sơ sinh và trẻ nhỏ, 6 trẻ tử vong."], ["三聚氰胺含氮量約 66%，蛋白質約 16%，業者用它讓蛋白質的檢驗值看起來更漂亮。", "Melamine chứa khoảng 66% nitơ, trong khi protein khoảng 16%, nên kẻ gian dùng nó để làm cho số liệu kiểm nghiệm protein trông đẹp hơn."], ["台灣也在三合一咖啡、奶精等產品中驗出。報告好看，不代表沒問題。", "Đài Loan cũng phát hiện melamine trong cà phê 3 trong 1, bột kem pha cà phê và một số sản phẩm khác."]]}, {"level": 3, "year": "2013", "bg": "bg-2013.jpg", "title": ["毒澱粉事件", "Sự kiện tinh bột độc"], "theme": ["非法添加與標示不實", "Phụ gia bất hợp pháp và ghi nhãn sai sự thật"], "badge": ["法規守門員", "Người gác cổng quy định"], "remember": ["好用、便宜不是理由，沒有准用就是不能用。", "Dễ dùng, rẻ không phải là lý do. Chưa được cho phép thì không được dùng."], "story": [["歡迎來到 2013 年 5 月。業者為了讓澱粉更 Q 彈、成本更低，偷偷加了工業原料順丁烯二酸酐。", "Tháng 5/2013, để tăng độ dai giòn và giảm chi phí, một số nhà sản xuất đã cho trái phép nguyên liệu công nghiệp anhydrit maleic vào tinh bột."], ["它不是法規准用的化製澱粉品項，用它做的食品，就是違法。", "Đây không phải loại tinh bột biến tính được pháp luật cho phép, nên thực phẩm làm từ nó là vi phạm."], ["粉圓、肉圓、粄條、黑輪等都受到影響。到 5 月 29 日，已回收封存 298 公噸。", "Trân châu, viên thịt, bánh canh, oden... đều bị ảnh hưởng. Đến ngày 29/5, đã thu hồi và niêm phong 298 tấn."], ["同年 10 月，夜市攤位又驗出同樣的問題。事情，沒有那麼快結束。", "Tháng 10 cùng năm, các quầy hàng ở chợ đêm lại bị phát hiện cùng một vấn đề."]]}, {"level": 4, "year": "2022", "bg": "bg-2022.jpg", "title": ["亞培嬰兒配方事件", "Sự kiện sữa công thức Abbott"], "theme": ["環境監控與微生物管制", "Giám sát môi trường và kiểm soát vi sinh"], "badge": ["環境鷹眼", "Mắt diều hâu môi trường"], "remember": ["成品合格不等於工廠沒問題，環境陽性是給你的提前警告。", "Thành phẩm đạt không có nghĩa là nhà máy không có vấn đề. Môi trường dương tính là lời cảnh báo sớm dành cho bạn."], "story": [["2022 年 2 月，美國 FDA 與 CDC 調查 4 起嬰兒個案。嬰兒都住院，1 人死亡。", "Tháng 2/2022, FDA và CDC Hoa Kỳ điều tra 4 ca bệnh ở trẻ sơ sinh, tất cả đều phải nhập viện, 1 trẻ tử vong."], ["產品來自亞培 Sturgis 工廠，亞培自願召回。", "Sản phẩm đến từ nhà máy Sturgis của Abbott, và Abbott tự nguyện thu hồi."], ["亞培表示成品檢驗都是陰性，環境檢出的菌在非產品接觸區，基因定序也沒能把病例與環境菌株連起來。", "Abbott cho biết kiểm nghiệm thành phẩm đều âm tính, vi khuẩn phát hiện trong môi trường nằm ở khu vực không tiếp xúc với sản phẩm, và giải trình tự gen cũng không liên kết được ca bệnh với chủng vi khuẩn trong môi trường."], ["但 FDA 仍指出，嬰兒配方工廠的環境，是這種菌最可能的來源之一。", "Tuy vậy, FDA vẫn chỉ ra rằng môi trường nhà máy sữa công thức cho trẻ sơ sinh là một trong những nguồn lây nhiễm khả dĩ nhất của loại vi khuẩn này."]]}];

function show(html,opts){opts=opts||{};document.querySelectorAll('.cfx').forEach(function(c){if(c.parentNode)c.parentNode.removeChild(c)});scene(opts.bg);app.className=S.noAnim?'na':'';app.innerHTML=html;window.scrollTo(0,0);
  var lb=app.querySelectorAll('.lang button');for(var i=0;i<lb.length;i++)lb[i].onclick=function(){setLang(this.getAttribute('data-l'))}}
function setLang(l){if(l===S.lang)return;S.lang=l;try{localStorage.setItem('fsw_lang',l)}catch(e){}document.documentElement.lang=l==='zh'?'zh-TW':'vi';var eg=document.getElementById('egg');if(eg){eg.querySelector('.eggc').innerHTML=policyInner();document.getElementById('eggx').onclick=closePolicy}if(S.render){S.noAnim=true;try{S.render(true)}finally{S.noAnim=false}}}
function busy(on){$('#busy').style.display=on?'flex':'none'}
var toastT;function toast(msg){var t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){t.style.display='none'},4500)}

/* api */
function api(body){
  if(!API)return Promise.reject({code:'CONFIG'});
  function once(n){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json()})
    .catch(function(e){if(n<2)return new Promise(function(res){setTimeout(res,900)}).then(function(){return once(n+1)});throw {code:'NET'}})}
  return once(0).then(function(j){if(!j||!j.ok){var e=(j&&j.error)||'SERVER';throw {code:e,data:j}}return j})
}
function errMsg(e){var c=e&&e.code||'SERVER';var k='e_'+c;if(!T[k])k='e_SERVER';var m=tr(k);if(c==='NOT_STARTED'&&e.data&&e.data.start)m+=e.data.start;return m}
function call(body,okFn,errFn){busy(true);return api(body).then(function(j){busy(false);return okFn(j)}).catch(function(e){busy(false);if(errFn&&errFn(e)===true)return;if(e&&e.code==='OUT_OF_SYNC'){loadQuestion();return}
  if(e&&(e.code==='NO_STATE'||e.code==='NOT_FOUND')&&body.action!=='login'){stopTimer();logout(tr('e_RELOGIN'));return}
  toast(errMsg(e))})}

    call({action:'clue',id:S.key,level:S.level,i:q0.i,n:q0.cn+1},function(j){
      if(!j.q||!S.q||S.q.i!==q0.i||!j.q.clues)return;
      S.q.clues=j.q.clues;S.q.cn=j.q.cn;S.q.ct=j.q.ct;S.newClue=j.q.cn-1;screenQuestion();tick();window.scrollTo(0,sy)})};
}
var submitting=false;
function submit(choice){
  if(submitting)return;submitting=true;stopTimer();
  var q=S.q,i=q.i;S.lastQ=q;
  call({action:'answer',id:S.key,level:S.level,i:i,choice:choice},function(j){submitting=false;S.state=j.state;if(!j.result){loadQuestion();return}if(j.result.q)S.lastQ=j.result.q;afterAnswer(j.result,false)},
    function(e){submitting=false;
      /* 送出失敗：倒數照原本的伺服器時間繼續走（不中斷），玩家可再按一次 */
      if(S.q&&S.q.i===i&&e&&(e.code==='NET'||e.code==='SERVER'||e.code==='BUSY'))startTimer();
      return false});
  setTimeout(function(){submitting=false},15000);
}
function afterAnswer(res,fromLoad){S.res=res;screenFeedback()}
function optTxt(q,i){return (S.lang==='zh'?q.optZh:q.optVi)[i]}
function screenFeedback(){
  S.render=screenFeedback;var r=S.res,q=S.lastQ,m=L(S.level);
  var bg=m.bg,good=r.correct;
  var banner,npcImg,says,e=S.lang==='zh'?r.eZh:r.eVi;
  if(good){banner='<div class="banner good">'+IC.check('#fff',30)+'<div><div class="b1">'+esc(tr('fbGood'))+' <span style="color:#FFE9A8">'+esc(tr('pts',r.pts.total))+'</span></div><div class="b2">'+esc(tr('ptsDetail',r.pts.base,r.pts.speed,r.pts.streak,r.pts.clue||0))+'</div>'+(r.pts.clue>=30?'<div style="font-size:18px;color:#FFE9A8;margin-top:2px">'+esc(tr('clueNice'))+'</div>':'')+'</div></div>';npcImg='cheer';says=tr('npcGood',e)}
  else{banner='<div class="banner bad">'+IC.x+'<div><div class="b1">'+esc(r.timeout?tr('fbTime'):tr('fbBad'))+'</div><div class="b2">'+esc(tr('fbBadSub'))+'</div></div></div>';npcImg='worried';says=r.timeout?tr('npcTime',e):tr('npcBad',e)}
  var opts='';
  if(q){
    if(!good&&r.picked!==null)opts+='<div class="fo bad"><span class="k">'+'ABCD'[r.picked]+'</span><div><div>'+esc(optTxt(q,r.picked))+'</div><small>'+esc(tr('yourPick'))+'</small></div></div>';
    if(!good&&r.picked===null)opts+='<div style="font-size:18px;color:#FFB3A3;font-weight:700">'+esc(tr('noPick'))+'</div>';
    opts+='<div class="fo good"><span class="k">'+'ABCD'[r.correctIndex]+'</span><div><div style="font-weight:700">'+esc(optTxt(q,r.correctIndex))+'</div><small>'+esc(tr('correctAns'))+'</small></div></div>';
  }
  var last=r.levelDone;
  var hdr=hdrTitle(esc(tr('qN',r.idx))+' <span style="color:var(--mut);font-size:20px">/ 4</span>',m.year+' '+z(m.title),'<div style="display:flex;gap:4px">'+shieldRow(r.shields,3,28)+'</div>');
  show(hdr+'<div class="wrap"><div class="body dsk"><div class="npcCol">'+npc(npcImg,good?'jump':'sway')+'</div><div class="mainCol">'+banner
   +(opts?'<div class="opts" style="gap:10px">'+opts+'</div>':'')
   +dlg(says,'<button class="btn" id="nx" style="margin-top:12px">'+esc(last?tr('finishLv'):tr('nextQ'))+'</button>')
   +'</div></div></div>',{bg:bg});
  if(good)burst(r.pts&&r.pts.speed>=30?34:22);
  else{var sv=app.querySelectorAll('.hdr .r > div svg')[r.shields];if(sv)sv.setAttribute('class','brk')}
  $('#nx').onclick=function(){
    if(r.levelDone){screenClear(r.summary)}
    else if(r.shieldsOut){screenOut()}
    else loadQuestion()};
}
function screenOut(){
  S.render=screenOut;var r=S.res,m=L(S.level),lv=S.state.levels[S.level-1];
  var left=4-r.idx;
  var rows='';[tr('out1',left),tr('out2'),tr('out3')].forEach(function(t,i){rows+='<div class="rule"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7FBF8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC.ru[[1,2,1][i]]+'</svg><span>'+esc(t)+'</span></div>'});
  show(hdrTitle(esc(tr('qN',r.idx))+' <span style="color:var(--mut);font-size:20px">/ 4</span>',m.year+' '+z(m.title),'<div style="display:flex;gap:4px">'+shieldRow(0,3,28)+'</div>')
   +'<div class="wrap"><div class="body dsk"><div class="npcCol">'+npc('cheer','sm')+'</div><div class="mainCol">'
   +'<div class="banner bad" style="background:rgba(10,20,14,.9)">'+IC.shield(false,'#FF8A75',34)+'<div><div class="b1">'+esc(tr('outT'))+'</div><div class="b2">'+esc(tr('outS'))+'</div></div></div>'
   +'<div class="panel stat" style="padding:0;border:0;background:none;margin-top:12px"><div><div class="v">'+lv.correct+'<span style="font-size:20px;color:var(--mut)"> / '+r.idx+'</span></div><div class="c">'+esc(tr('correctCnt'))+'</div></div><div><div class="v">+'+fmt(lv.score)+'</div><div class="c">'+esc(tr('lvScoreSoFar'))+'</div></div></div>'
   +'<div class="panel"><div class="serif" style="font-weight:900;font-size:24px;color:var(--gold);margin-bottom:10px">'+esc(tr('nextWill'))+'</div><div style="display:flex;flex-direction:column;gap:12px">'+rows+'</div></div>'
   +dlg(tr('outNpc'),'<button class="btn" id="go" style="margin-top:12px">'+esc(tr('outBtn'))+'</button>')
   +'</div></div></div>',{bg:null});
  $('#go').onclick=function(){loadQuestion()};
}
function screenReview(){
  S.render=screenReview;var q=S.q,m=L(S.level),rv=S.rv;
  var e=S.lang==='zh'?rv.eZh:rv.eVi;
  var opts='';for(var i=0;i<4;i++){if(i===rv.ci)opts+='<div class="fo good"><span class="k">'+'ABCD'[i]+'</span><div><div style="font-weight:700">'+esc(optTxt(q,i))+'</div><small>'+esc(tr('correctAns'))+'</small></div></div>';else opts+='<div class="opt" style="opacity:.75;min-height:0"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(optTxt(q,i))+'</span></div>'}
  var last=q.i>=q.n-1;
  show(hdrTitle(esc(tr('qN',q.i+1))+' <span style="color:var(--mut);font-size:20px">/ '+q.n+'</span>',m.year+' '+z(m.title),'<div style="display:flex;gap:4px">'+shieldRow(0,3,28)+'</div>')
   +'<div class="wrap"><div class="body dsk"><div class="npcCol">'+npc('explain')+'<div class="beside"><span class="tag">'+esc(tr('reviewTag'))+'</span></div></div><div class="mainCol">'
   +cluesHtml(q,true)+dlg(S.lang==='zh'?q.qZh:q.qVi)+'<div class="opts" style="gap:10px">'+opts+'</div>'
   +dlg(tr('npcRev',e),'<button class="btn" id="nxr" style="margin-top:12px">'+esc(last?tr('finishLv'):tr('nextQ'))+'</button>')
   +'</div></div></div>',{bg:m.bg});
  $('#nxr').onclick=function(){call({action:'ack',id:S.key,level:S.level,i:q.i},function(j){S.state=j.state;if(j.result.levelDone){S.res=j.result;screenClear(j.result.summary)}else loadQuestion()})};
}
function screenClear(sm){
  S.summary=sm;S.render=function(){screenClear(sm)};var m=L(S.level),all=S.state.levels.every(function(l){return l.status==='done'});
  var remBox='<div class="remember"><b>'+esc(tr('remember'))+'</b><div class="serif">'+esc(z(m.remember))+'</div></div>';
  show(hdrTitle(esc(tr('clearHd',S.level)),m.year+' '+z(m.title))+'<div class="wrap"><div class="body dsk"><div class="npcCol">'+npc('celebrate',sm.badge?'jump':'')+'<div class="beside"><div style="font-weight:900;font-size:36px;line-height:1.1" class="serif">'+esc(sm.badge?tr('clearT'):tr('clearT2'))+'</div></div></div><div class="mainCol">'
   +dlg(sm.badge?tr('clearNpc',z(m.badge)):(sm.correct>=2?tr('clearNpc2a'):tr('clearNpc2b')),KN[S.level]?'<button type="button" class="knchip" id="knb">'+IC.bulb+'<span>'+esc(KNT[S.lang==='zh'?0:1])+'</span><small>'+esc(KNH[S.lang==='zh'?0:1])+'</small></button>':'')
   +'<div class="starsRow">'+starRow(sm.correct,46,true)+'</div>'
   +(sm.badge?'':remBox)
   +'<div class="panel stat" style="padding:0;border:0;background:none;margin-top:12px"><div><div class="v">'+sm.correct+'<span style="font-size:20px;color:var(--mut)"> / '+sm.total+'</span></div><div class="c">'+esc(tr('correctCnt'))+'</div></div>'
   +'<div><div style="display:flex;justify-content:center;gap:2px">'+shieldRow(sm.shields,3,26)+'</div><div class="c">'+esc(tr('shieldsLbl',sm.shields))+'</div></div>'
   +'<div><div class="v" id="cu1">+'+fmt(sm.score)+'</div><div class="c">'+esc(tr('lvScore'))+'</div></div></div>'
   +(sm.badge?'<div class="panel" style="display:flex;align-items:center;gap:12px;border-color:var(--gold);background:rgba(227,162,26,.18)">'+'<span class="litpop">'+medalIc(true,46)+'</span>'+'<div><div style="font-size:18px;color:#F7D58A">'+esc(tr('gotBadge'))+'</div><div class="serif" style="font-weight:900;font-size:26px;color:#FFE9A8">'+esc(z(m.badge))+'</div></div></div>':'<div class="panel" style="display:flex;align-items:center;gap:12px;border:2px dashed #4A6552;background:transparent">'+medalIc(false,46)+'<div><div style="font-size:18px;color:#9FB2A4">'+esc(tr('notGot'))+'</div><div class="serif" style="font-weight:900;font-size:26px;color:#9FB2A4">'+esc(z(m.badge))+'</div></div></div>')
   +(sm.badge?remBox:'')
   +'<div class="btns">'+(all?'<button class="btn" id="fin">'+esc(tr('toFinal'))+'</button>':(S.level<4?'<button class="btn" id="nxl">'+esc(tr('toNext'))+'</button>':''))+'<button class="btn sec" id="lst">'+esc(tr('toList'))+'</button></div>'
   +'</div></div></div>',{bg:null});
  countUp($('#cu1'),sm.score,'+');if(sm.badge)burst(70);else document.querySelectorAll('.cfx').forEach(function(c){c.parentNode.removeChild(c)});
  var kb=$('#knb');if(kb)kb.onclick=function(){showKn(S.level)};
  var a=$('#fin');if(a)a.onclick=function(){screenFinal()};
  var b=$('#nxl');if(b)b.onclick=function(){S.level++;startStory(S.level)};
  $('#lst').onclick=function(){screenMap()};
}
function lbHtml(lb){
  var h='<div class="lb">';
  var maxA=1;lb.ranked.forEach(function(d){if(d.avg>maxA)maxA=d.avg});
  lb.ranked.forEach(function(d){h+='<div class="lbr'+(d.dept===lb.mine?' me':'')+'"><div class="row1"><div><span class="rk">'+d.rank+'</span>'+esc(deptName(d.dept))+'</div><div>'+esc(tr('avg'))+' '+fmt(d.avg)+'</div></div><div class="row2"><div class="bg"><i style="width:'+Math.round(d.avg/maxA*100)+'%"></i></div><div>'+esc(tr('doneN',d.done,d.headcount))+'</div></div></div>'});
  lb.others.forEach(function(d){h+='<div class="lbr'+(d.dept===lb.mine?' me':'')+'"><div class="row1"><div>'+esc(deptName(d.dept))+'</div><div style="font-weight:400;color:var(--mut);font-size:18px">'+esc(d.done?tr('doneN',d.done,d.headcount):tr('noDone'))+'</div></div></div>'});
  h+='</div>';
  return h}
function screenFinal(){
  S.render=screenFinal;var st=S.state,full=st.correct>=16,fk=S.lang==='zh'?0:1;
  show(hdrBrand()+'<div class="wrap"><div class="body dsk"><div class="npcCol'+(full?' fullc':'')+'">'+npc(full?'trophy':'celebrate')+'<div class="beside"><div class="eyebrow">'+(full?esc(FULL.e[fk]):esc(tr('allT1')))+'</div><h1 class="t serif">'+esc(full?FULL.t[fk]:tr('allT2'))+'</h1></div></div><div class="mainCol">'
   +dlg(full?FULL.n[fk]:tr('allNpc'))
   +'<div class="panel stat" style="padding:0;border:0;background:none;margin-top:12px"><div><div class="c">'+esc(tr('total'))+'</div><div class="v cu2">'+fmt(st.score)+'</div></div><div><div class="c">'+esc(tr('correctCnt'))+'</div><div class="v">'+st.correct+'<span style="font-size:20px;color:var(--mut)"> / 16</span></div></div></div>'
   +'<div class="panel"><div class="serif" style="font-weight:900;font-size:24px;color:var(--gold)">'+esc(tr('myBadges'))+'</div><div class="bgrid">'+[1,2,3,4].map(function(i){var m=L(i),l=st.levels[i-1];return '<div class="bgi'+(l.badge?'':' no')+'"><div style="display:flex;justify-content:center"><span class="'+(l.badge?'litpop':'')+'">'+medalIc(l.badge,44)+'</span></div><small>'+m.year+'</small>'+esc(l.badge?z(m.badge):tr('notGot'))+'<div>'+starRow(l.correct,20,true)+'</div></div>'}).join('')+'</div></div>'
   +'<div class="panel"><div class="serif" style="font-weight:900;font-size:24px;color:var(--gold)">'+esc(tr('fourLines'))+'</div>'+[1,2,3,4].map(function(i){return '<div class="take"><b class="serif">'+L(i).year+'</b><span>'+esc(z(L(i).remember))+'</span></div>'}).join('')+'</div>'
   +'<div class="panel"><div class="serif" style="font-weight:900;font-size:24px;color:var(--gold)">'+esc(tr('lbT'))+'</div><div style="height:12px"></div><div id="lb">…</div></div>'
   +'<div class="foot" style="padding-top:14px">'+esc(tr('oneTime'))+'</div>'
   +'<div class="btns"><button class="btn sec" id="rv">'+esc(tr('review4'))+'</button><button class="sw" id="sw">'+esc(tr('switchId'))+'</button></div>'
   +'</div></div></div>',{bg:null});
  $('#rv').onclick=function(){screenMap()};$('#sw').onclick=function(){logout()};
  countUp($('.cu2'),st.score,'');if(!S.finalBurst&&st.levels.some(function(l){return l.badge})){S.finalBurst=1;burst(90)}
  function put(lb){var e=$('#lb');if(e)e.innerHTML=lbHtml(lb)}
  if(S.lbCache)put(S.lbCache);else api({action:'leaderboard',id:S.key}).then(function(j){S.lbCache=j;put(j)}).catch(function(){var e=$('#lb');if(e)e.textContent='—'});
}
function screenDone(){
  S.render=screenDone;var st=S.state;
  show(hdrBrand()+'<div class="wrap"><div class="narrow"><div class="npcCol">'+npc('happy')+'<div class="beside"><span class="pill">'+esc(tr('empNo')+S.key)+'</span></div></div>'
   +dlg(tr('doneNpc'))
   +'<div class="panel stat" style="border:0;background:none;padding:0"><div><div class="c">'+esc(tr('total'))+'</div><div class="v cu2">'+fmt(st.score)+'</div></div><div><div class="c">'+esc(tr('correctCnt'))+'</div><div class="v">'+st.correct+'<span style="font-size:20px;color:var(--mut)"> / 16</span></div></div></div>'
   +'<div class="btns"><button class="btn" id="r1">'+esc(tr('seeResult'))+'</button><button class="btn sec" id="r2">'+esc(tr('review4'))+'</button></div></div><div class="spacer"></div><div class="foot">'+esc(tr('copy'))+'<br><button class="sw" id="sw">'+esc(tr('switchId'))+'</button></div></div>');
  $('#sw').onclick=function(){logout()};
  countUp($('.cu2'),st.score,'');
  $('#r1').onclick=function(){screenFinal()};$('#r2').onclick=function(){screenMap()};
}
/* boot */
document.documentElement.lang=S.lang==='zh'?'zh-TW':'vi';
['bg-2011.jpg','bg-2013.jpg','bg-2008.jpg','bg-2022.jpg'].forEach(function(f){var i=new Image();i.src='./'+f});
var sid=ss('fsw_id');
if(sid&&API){S.id=sid;call({action:'login',id:sid},function(j){S.key=j.key;S.dept=j.dept;S.state=j.state;
   if(j.state.finished){screenDone();return}
   if(ss('fsw_ok')===S.key){S.confirmed=true;screenMap();return}screenConfirm()},function(e){ss('fsw_id',null);screenLogin(e&&e.code!=='NOT_FOUND'?errMsg(e):'');return true})}
else screenLogin(API?'':tr('e_CONFIG'));
window.__fsw=S;
})();
</script>
